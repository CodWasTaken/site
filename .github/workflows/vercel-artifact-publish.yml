name: Vercel Artifact Publish
on:
  push:
    branches: [next/trust-foundation]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ef49a0eaf80a95a1069a1bbe2d35cf943c3f7dd1
          path: source
      - uses: actions/checkout@v4
        with:
          repository: CodWasTaken/data
          ref: db80383717ded0e29af497d36894c52bde8a01fa
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - working-directory: source
        run: npm ci
      - working-directory: source
        run: npm test
      - working-directory: source
        env:
          PERKCOMMONS_DATA_REPOSITORY_PATH: ${{ github.workspace }}/data
        run: npm run build
      - working-directory: source
        run: npm run audit:site
      - name: Publish immutable prebuilt artifact branch
        shell: bash
        run: |
          set -euo pipefail
          tar -C source -cJf perkcommons-dist.tar.xz dist
          sha256sum perkcommons-dist.tar.xz | tee artifact.sha256
          base64 -w0 perkcommons-dist.tar.xz > artifact.b64
          mkdir artifact-branch
          split -b 700000 -d -a 2 artifact.b64 artifact-branch/part-
          cp artifact.sha256 artifact-branch/artifact.sha256
          printf '%s\n' 'site_sha=ef49a0eaf80a95a1069a1bbe2d35cf943c3f7dd1' 'data_sha=db80383717ded0e29af497d36894c52bde8a01fa' > artifact-branch/provenance.txt
          cd artifact-branch
          git init -b next/vercel-artifact
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'chore(deploy): publish verified Vercel artifact'
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:next/vercel-artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
