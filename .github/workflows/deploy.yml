name: Fork deployment dry run
on:
  workflow_dispatch:
    inputs:
      data_sha:
        description: Exact commit from CodWasTaken/data
        required: true
        type: string
      schema_version:
        description: Expected schema version
        required: true
        default: "1+2.0"
        type: string
      taxonomy_version:
        description: Expected taxonomy version
        required: true
        default: "1"
        type: string
permissions:
  contents: read
concurrency:
  group: perkcommons-production
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: CodWasTaken/data
          ref: ${{ inputs.data_sha }}
          path: .data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          PUBLIC_SUPABASE_URL: https://example.invalid
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          PUBLIC_TURNSTILE_SITE_KEY: placeholder
      - run: npm run build
        env:
          PERKCOMMONS_DATA_REPOSITORY_PATH: ${{ github.workspace }}/.data
          PERKCOMMONS_DATA_SHA: ${{ inputs.data_sha }}
          PERKCOMMONS_SITE_SHA: ${{ github.sha }}
          PUBLIC_SUPABASE_URL: https://example.invalid
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          PUBLIC_TURNSTILE_SITE_KEY: placeholder
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Verify exact-version metadata and static assets
        run: |
          test -f dist/data/opportunities.json
          test -f dist/catalog-index.json
          test -f dist/sitemap-index.xml
          grep -q '${{ inputs.data_sha }}' dist/data/opportunities.json
          grep -q '"schemaVersion":"${{ inputs.schema_version }}"' dist/data/opportunities.json
          grep -q '"taxonomyVersion":"${{ inputs.taxonomy_version }}"' dist/data/opportunities.json
      - name: Confirm no deployment occurred
        run: echo "Dry run complete. No Cloudflare credentials were loaded and no deployment was triggered."
