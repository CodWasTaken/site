name: Site CI
on:
  pull_request:
  push:
    branches: [main, next/trust-foundation]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CodWasTaken/data
          ref: next/schema-v2
          path: .data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          PERKCOMMONS_DATA_REPOSITORY_PATH: ${{ github.workspace }}/.data
      - run: npm run audit:site
      - run: npx playwright install --with-deps chromium
      - name: Run browser regression suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee playwright-test.log
        env:
          PERKCOMMONS_DATA_REPOSITORY_PATH: ${{ github.workspace }}/.data
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-diagnostics
          path: |
            playwright-test.log
            test-results
          if-no-files-found: warn
          retention-days: 1
