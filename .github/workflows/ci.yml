name: Site CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CodWasTaken/data
          path: .data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - run: npm run build
        env:
          PERKCOMMONS_DATA_PATH: ${{ github.workspace }}/.data/opportunities
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      - run: npx playwright install --with-deps chromium
      - name: Run browser tests with diagnostics
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee playwright-output.txt
          status=${PIPESTATUS[0]}
          {
            echo '## Playwright diagnostic tail'
            echo '```text'
            tail -n 200 playwright-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          PERKCOMMONS_DATA_PATH: ${{ github.workspace }}/.data/opportunities
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: playwright-output.txt
          if-no-files-found: warn
