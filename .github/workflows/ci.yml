name: Site CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CodWasTaken/data
          ref: next/schema-v2
          path: .data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          PERKCOMMONS_DATA_REPOSITORY_PATH: ${{ github.workspace }}/.data
      - name: Run site audit
        id: site_audit
        run: |
          set +e
          npm run audit:site > site-audit.log 2>&1
          status=$?
          cat site-audit.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload site audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-diagnostics
          path: site-audit.log
      - name: Fail if site audit failed
        if: steps.site_audit.outputs.status != '0'
        run: exit 1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          PERKCOMMONS_DATA_REPOSITORY_PATH: ${{ github.workspace }}/.data
