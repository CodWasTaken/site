name: Verify Vercel Next dev

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'ops/verify-vercel-live'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose fresh Next Vercel deployment
        shell: bash
        run: |
          set -euo pipefail
          base="https://perkcommons-next-bkt0nxm2n-cod-s-projects1.vercel.app"
          code=$(curl -sS -L -D /tmp/headers -o /tmp/home.html -w '%{http_code}' "$base/")
          echo "HTTP_STATUS=$code"
          grep -Ei '^(HTTP/|content-type:|location:|server:|x-vercel-|cache-control:)' /tmp/headers || true
          echo "--- body start ---"
          head -c 1600 /tmp/home.html | tr '\n' ' '
          echo
          test "$code" = "200"
          grep -F "Open data. Evidence-led review." /tmp/home.html
          grep -F "Default opportunities" /tmp/home.html
          grep -F "779" /tmp/home.html
