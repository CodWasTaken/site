name: Verify Vercel Next dev

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'ops/verify-vercel-live'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify actual Next foundation deployment
        shell: bash
        run: |
          set -euo pipefail
          base="https://perkcommons-next-dev-final-adsvg4hek-cod-s-projects1.vercel.app"
          expected_data_sha="db80383717ded0e29af497d36894c52bde8a01fa"

          echo "Checking $base"
          code=$(curl -sS -L --retry 8 --retry-delay 8 --retry-all-errors -o /tmp/home.html -w '%{http_code}' "$base/")
          echo "home HTTP_STATUS=$code"
          test "$code" = "200"
          grep -F "Open data. Evidence-led review." /tmp/home.html
          grep -F "Ordinary free products and generic memberships are kept outside default results." /tmp/home.html
          grep -F "Default opportunities" /tmp/home.html
          grep -F "779" /tmp/home.html

          code=$(curl -sS -L --retry 4 --retry-delay 5 -o /tmp/catalog.json -w '%{http_code}' "$base/catalog-index.json")
          echo "catalog HTTP_STATUS=$code"
          test "$code" = "200"
          test "$(jq -r '.metadata.dataCommitSha' /tmp/catalog.json)" = "$expected_data_sha"
          test "$(jq '.records | length' /tmp/catalog.json)" = "1068"

          code=$(curl -sS -L --retry 4 --retry-delay 5 -o /tmp/facets.json -w '%{http_code}' "$base/facet-counts.json")
          echo "facets HTTP_STATUS=$code"
          test "$code" = "200"
          test "$(jq '[.facets.category[]] | add' /tmp/facets.json)" = "779"
          test "$(jq -r '.metadata.dataCommitSha' /tmp/facets.json)" = "$expected_data_sha"

          code=$(curl -sS -L --retry 4 --retry-delay 5 -o /tmp/api.json -w '%{http_code}' "$base/api/opportunities?limit=1")
          echo "api HTTP_STATUS=$code"
          test "$code" = "200"
          grep -F '"opportunities"' /tmp/api.json

          echo "VERCEL_NEXT_FOUNDATION_VERIFIED=$base"
