name: Verify Vercel Next dev

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'ops/verify-vercel-live'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify final Next Vercel deployment
        shell: bash
        run: |
          set -euo pipefail
          base="https://perkcommons-next-dev-final-cod-s-projects1.vercel.app"
          expected_data_sha="db80383717ded0e29af497d36894c52bde8a01fa"

          echo "Checking $base"
          code=$(curl -sS -L --retry 10 --retry-delay 8 --retry-all-errors -o /tmp/home.html -w '%{http_code}' "$base/")
          echo "home HTTP_STATUS=$code"
          test "$code" = "200"
          grep -F "Open data. Evidence-led review." /tmp/home.html
          grep -F "Ordinary free products and generic memberships are kept outside default results." /tmp/home.html
          grep -F "Default opportunities" /tmp/home.html
          grep -F "779" /tmp/home.html
          grep -F 'rel="canonical" href="https://perkcommons-next-dev-final-cod-s-projects1.vercel.app/' /tmp/home.html

          code=$(curl -sS -L --retry 5 --retry-delay 5 -o /tmp/catalog.json -w '%{http_code}' "$base/catalog-index.json")
          echo "catalog HTTP_STATUS=$code"
          test "$code" = "200"
          test "$(jq -r '.metadata.dataCommitSha' /tmp/catalog.json)" = "$expected_data_sha"
          test "$(jq '.records | length' /tmp/catalog.json)" = "1068"

          code=$(curl -sS -L --retry 5 --retry-delay 5 -o /tmp/facets.json -w '%{http_code}' "$base/facet-counts.json")
          echo "facets HTTP_STATUS=$code"
          test "$code" = "200"
          test "$(jq '[.facets.category[]] | add' /tmp/facets.json)" = "779"
          test "$(jq -r '.metadata.dataCommitSha' /tmp/facets.json)" = "$expected_data_sha"

          code=$(curl -sS -L --retry 5 --retry-delay 5 -o /tmp/trust.html -w '%{http_code}' "$base/trust/")
          echo "trust HTTP_STATUS=$code"
          test "$code" = "200"
          grep -F "Trust and transparency" /tmp/trust.html

          code=$(curl -sS -L --retry 5 --retry-delay 5 -o /tmp/privacy.html -w '%{http_code}' "$base/privacy/")
          echo "privacy HTTP_STATUS=$code"
          test "$code" = "200"
          grep -F "A plain-language privacy notice." /tmp/privacy.html

          code=$(curl -sS -L --retry 5 --retry-delay 5 -o /tmp/about.html -w '%{http_code}' "$base/about/")
          echo "about HTTP_STATUS=$code"
          test "$code" = "200"
          grep -F "This is the PerkCommons Next experimental fork." /tmp/about.html

          code=$(curl -sS -L --retry 5 --retry-delay 5 -o /tmp/api.json -w '%{http_code}' "$base/api/v1/opportunities?limit=1")
          echo "api HTTP_STATUS=$code"
          test "$code" = "200"
          test "$(jq '.records | length' /tmp/api.json)" = "1"

          echo "VERCEL_NEXT_FOUNDATION_VERIFIED=$base"
