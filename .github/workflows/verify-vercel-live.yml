name: Verify Vercel Next dev

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'ops/verify-vercel-live'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose public Vercel deployment
        shell: bash
        run: |
          set -euo pipefail
          base="https://perkcommons-next-dev-public-cod-s-projects1.vercel.app"

          echo "Checking $base"
          code=$(curl -sS -L -D /tmp/headers -o /tmp/home.html -w '%{http_code}' "$base/")
          echo "HTTP_STATUS=$code"
          echo "--- response headers ---"
          grep -Ei '^(HTTP/|content-type:|location:|server:|x-vercel-|cache-control:)' /tmp/headers || true
          echo "--- response body start ---"
          head -c 1200 /tmp/home.html | tr '\n' ' '
          echo

          test "$code" = "200"
          grep -F "PerkCommons" /tmp/home.html

          for path in trust privacy about moderator-login; do
            code=$(curl -sS -L -o "/tmp/$path.html" -w '%{http_code}' "$base/$path/")
            echo "$path HTTP_STATUS=$code"
            test "$code" = "200"
          done

          grep -F "Trust and transparency" /tmp/trust.html
          grep -F "A plain-language privacy notice." /tmp/privacy.html
          grep -F "operated by Cod from Poland" /tmp/about.html
          grep -F "Moderator" /tmp/moderator-login.html

          code=$(curl -sS -L -o /tmp/api.json -w '%{http_code}' "$base/api/opportunities?limit=1")
          echo "api HTTP_STATUS=$code"
          head -c 500 /tmp/api.json
          echo
          test "$code" = "200"
          grep -F '"opportunities"' /tmp/api.json

          echo "VERCEL_LIVE=$base"
