name: Vercel Package
on:
  push:
    branches: [next/trust-foundation]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ef49a0eaf80a95a1069a1bbe2d35cf943c3f7dd1
      - uses: actions/checkout@v4
        with:
          repository: CodWasTaken/data
          ref: db80383717ded0e29af497d36894c52bde8a01fa
          path: .data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          PERKCOMMONS_DATA_REPOSITORY_PATH: ${{ github.workspace }}/.data
      - run: npm run audit:site
      - name: Package immutable Vercel artifact
        run: tar -czf perkcommons-dist.tgz dist
      - uses: actions/upload-artifact@v4
        with:
          name: perkcommons-vercel-dist
          path: perkcommons-dist.tgz
          if-no-files-found: error
          retention-days: 1
