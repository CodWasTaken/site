name: Vercel Binding Probe
on:
  push:
    branches: [next/trust-foundation]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel deployment binding names
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID_SECRET: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_SECRET: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID_VAR: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_VAR: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID_SECRET VERCEL_PROJECT_ID_SECRET VERCEL_ORG_ID_VAR VERCEL_PROJECT_ID_VAR; do
            if [ -n "${!name}" ]; then echo "$name=present"; else echo "$name=absent"; fi
          done | tee binding.log
      - uses: actions/upload-artifact@v4
        with:
          name: vercel-binding-probe
          path: binding.log
